<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘却曲線トレーナー</title>
<style>
:root{
  --ink:#1d2b28;
  --paper:#f3ede0;
  --paper-dim:#e8dfc9;
  --moss:#3c5a48;
  --moss-dark:#2a4034;
  --rust:#b5562b;
  --gold:#c79a3e;
  --line:#cdbf9c;
  --danger:#a8412b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    repeating-linear-gradient(transparent, transparent 27px, var(--line) 28px),
    var(--paper);
  background-attachment:local;
  color:var(--ink);
  font-family: "Hiragino Mincho ProN","Yu Mincho", Georgia, "Noto Serif JP", serif;
  line-height:1.6;
  min-height:100vh;
  padding:0 0 60px;
}
.wrap{max-width:840px;margin:0 auto;padding:32px 20px 0;}

header.top{
  display:flex;justify-content:space-between;align-items:flex-end;
  border-bottom:3px solid var(--ink);
  padding-bottom:14px;margin-bottom:18px;
}
header.top h1{
  font-size:26px;letter-spacing:.04em;margin:0;font-weight:700;
}
header.top .sub{
  font-family: Georgia, serif; font-style:italic; color:var(--rust);
  font-size:13px; letter-spacing:.06em;
}
nav.tabs{display:flex;gap:0;margin-bottom:26px;border-bottom:1px solid var(--line);}
nav.tabs button{
  flex:1;background:none;border:none;cursor:pointer;
  font-family:inherit;font-size:15px;padding:10px 6px;
  color:#6b6354;border-bottom:3px solid transparent;
  transition:.15s;
}
nav.tabs button.active{color:var(--ink);border-bottom-color:var(--rust);font-weight:700;}
nav.tabs button:hover{color:var(--ink);}

.card{
  background:var(--paper-dim);
  border:1px solid var(--line);
  border-radius:2px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 1px 0 var(--line);
}
.muted{color:#766f5e;font-size:13.5px;}

/* ---- stats strip ---- */
.stats-strip{display:flex;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.stat-box{
  flex:1;min-width:120px;background:var(--ink);color:var(--paper);
  padding:14px 16px;border-radius:2px;
}
.stat-box .num{font-size:24px;font-weight:700;color:var(--gold);}
.stat-box .lbl{font-size:11.5px;letter-spacing:.05em;opacity:.85;}

/* ---- quiz ---- */
.quiz-meta{display:flex;justify-content:space-between;font-size:12.5px;color:#766f5e;margin-bottom:10px;}
.quiz-word{
  font-size:38px;font-weight:700;text-align:center;margin:14px 0 6px;letter-spacing:.02em;
}
.quiz-hint{text-align:center;color:#8a8270;font-size:13px;margin-bottom:22px;}
.choices{display:grid;gap:10px;}
.choice-btn{
  text-align:left;background:var(--paper);border:1.5px solid var(--ink);
  border-radius:2px;padding:13px 16px;font-size:15px;cursor:pointer;
  font-family:inherit;color:var(--ink);transition:.12s;
  display:flex;gap:10px;align-items:center;
}
.choice-btn .key{
  font-weight:700;color:var(--rust);width:18px;flex:0 0 18px;
}
.choice-btn:hover:not(:disabled){background:#fffdf6;border-color:var(--rust);}
.choice-btn:disabled{cursor:default;}
.choice-btn.correct{background:var(--moss);border-color:var(--moss-dark);color:#fff;}
.choice-btn.correct .key{color:var(--gold);}
.choice-btn.wrong{background:var(--danger);border-color:#7c2c1c;color:#fff;}
.choice-btn.wrong .key{color:#fff;}

.feedback{margin-top:16px;text-align:center;font-size:14px;min-height:20px;}
.next-btn{
  display:block;margin:18px auto 0;background:var(--ink);color:var(--paper);
  border:none;padding:11px 30px;border-radius:2px;cursor:pointer;font-size:14.5px;
  font-family:inherit;letter-spacing:.03em;
}
.next-btn:hover{background:var(--moss-dark);}
.empty-state{text-align:center;padding:30px 10px;}
.empty-state .big{font-size:40px;margin-bottom:6px;}

/* ---- word list ---- */
table.wordlist{width:100%;border-collapse:collapse;font-size:14px;}
table.wordlist th{
  text-align:left;border-bottom:2px solid var(--ink);padding:6px 8px;font-size:12px;
  letter-spacing:.04em;color:#665f4f;
}
table.wordlist td{padding:7px 8px;border-bottom:1px solid var(--line);}
.stage-pill{
  display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;color:#fff;
  background:#9c9374;
}
.stage-pill.s0{background:#a8412b;}
.stage-pill.s1{background:#b5562b;}
.stage-pill.s2{background:#c79a3e;}
.stage-pill.s3{background:#8a8e3e;}
.stage-pill.s4{background:#3c5a48;}
.stage-pill.s5,.stage-pill.s6{background:#2a4034;}

/* ---- chart ---- */
.chart-wrap{position:relative;}
.legend{display:flex;gap:18px;font-size:12.5px;margin-top:10px;justify-content:center;}
.legend span{display:flex;align-items:center;gap:6px;}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;}

.add-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.add-row input{
  font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--ink);
  border-radius:2px;background:#fffdf6;flex:1;min-width:120px;
}
.add-row button{
  background:var(--moss);color:#fff;border:none;border-radius:2px;padding:8px 16px;
  cursor:pointer;font-family:inherit;font-size:14px;
}
.add-row button:hover{background:var(--moss-dark);}

button.link-btn{background:none;border:none;color:var(--rust);cursor:pointer;font-family:inherit;font-size:12.5px;text-decoration:underline;padding:0;}
.loading{text-align:center;padding:40px;color:#8a8270;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>忘却曲線トレーナー</h1>
    <div style="text-align:right;">
      <div class="sub">Ebbinghaus Vocabulary Trainer</div>
      <div style="margin-top:6px;">
        <span class="muted" id="profile-label">プロファイル: default</span>
        <span class="muted"> ・ </span>
        <button class="link-btn" id="switch-profile-btn">0から新しく始める／切り替え</button>
      </div>
      <div style="margin-top:4px;">
        <button class="link-btn" id="export-btn">バックアップ保存</button>
        <span class="muted"> ・ </span>
        <button class="link-btn" id="import-btn">バックアップ読込</button>
        <input type="file" id="import-file" accept="application/json" style="display:none;">
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button id="tab-quiz" class="active">学習する</button>
    <button id="tab-stats">忘却曲線データ</button>
    <button id="tab-words">単語リスト</button>
  </nav>

  <div id="view-quiz"></div>
  <div id="view-stats" style="display:none;"></div>
  <div id="view-words" style="display:none;"></div>
</div>

*/
/* ---- プロファイル機能 ----
   localStorageは file:// 環境ではブラウザ単位でほぼ共有されてしまうため、
   ファイル名を変えただけでは「0からやり直す」ことにならない。
   そこで保存先キーに「プロファイル名」を含め、名前を切り替えることで
   完全に独立したデータ領域を作れるようにする。
*/
const ACTIVE_PROFILE_KEY = 'ebbinghaus-vocab-active-profile';
function getActiveProfile(){
  try{ return localStorage.getItem(ACTIVE_PROFILE_KEY) || 'default'; }
  catch(e){ return 'default'; }
}
function setActiveProfile(name){
  try{ localStorage.setItem(ACTIVE_PROFILE_KEY, name); }catch(e){}
}
let CURRENT_PROFILE = 'default';
function lsPrefix(){ return 'ebbinghaus-vocab::'+CURRENT_PROFILE+'::'; }

let LS_AVAILABLE = true;
let MEM_FALLBACK = {}; // localStorageが使えない場合の一時的な代替（保存はされない）

function checkLocalStorageAvailable(){
  try{
    const testKey = lsPrefix()+'__test__';
    localStorage.setItem(testKey, '1');
    localStorage.removeItem(testKey);
    return true;
  }catch(e){
    return false;
  }
}

  if(!LS_AVAILABLE) return MEM_FALLBACK[key] ?? null;
  try{
    const raw = localStorage.getItem(lsPrefix()+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    console.error('localStorage読み込みに失敗しました', e);
    return MEM_FALLBACK[key] ?? null;
  }
}
function lsSet(key, value){
  if(!LS_AVAILABLE){
    MEM_FALLBACK[key] = value;
    return false;
  }
  try{
    localStorage.setItem(lsPrefix()+key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error('localStorage保存に失敗しました', e);
    MEM_FALLBACK[key] = value;
    LS_AVAILABLE = false;
    return false;
  }
}

async function loadAll(){

      WORDS = DEFAULT_WORDS.map((p,i)=>({id:'w'+i,en:p[0],jp:p[1]}));

  }catch(e){

    WORDS = DEFAULT_WORDS.map((p,i)=>({id:'w'+i,en:p[0],jp:p[1]}));
  }
  try{
    SRS = lsGet('srs') || {};
    if(typeof SRS !== 'object' || SRS===null) SRS = {};
  }catch(e){ SRS = {}; }
  try{
    LOG = lsGet('log') || [];
    if(!Array.isArray(LOG)) LOG = [];
  }catch(e){ LOG = []; }

  // 未登録の単語にSRS初期値を付与（古いデータ形式やSRSが壊れていても自己修復する）
  const now = Date.now();

    }
  });
  storageReady = true;
  saveWords(); saveSRS();
}

/* ============== クイズロジック ============== */
function pickDueWord(){
  const now = Date.now();
  const due = WORDS.filter(w=>SRS[w.id].nextReview<=now);
  if(due.length===0) return null;
  // 優先順位:
  // ①一度でも解いたことがある単語(間違えた・正解した単語)を最優先する。
  //   これにより「10分後に再出題」のような直近の復習が、大量にある
  //   未着手の新規単語の山に埋もれて後回しになるのを防ぐ。
  // ②同じグループ内では、次回復習日時が古い順（=期限切れが長い順）に出題する。
  due.sort((a,b)=>{
    const sa = SRS[a.id], sb = SRS[b.id];
    const reviewedA = sa.lastReview !== null;
    const reviewedB = sb.lastReview !== null;
    if(reviewedA !== reviewedB) return reviewedA ? -1 : 1; // 既習を優先
    return sa.nextReview - sb.nextReview;
  });
  return due[0];
}
// 意味欄が「捨てる、放棄する」のように複数訳語を含む場合、表示用には先頭の1訳語だけを使う。
// こうすることで正解・誤答とも常に単一の訳語に統一され、文言の長さや形式だけで正解が
// 見分けられてしまう問題を防ぐ。
function primaryMeaning(jp){
  return jp.split(/[、,]/)[0].trim();
}
function makeQuestion(word){
  const others = WORDS.filter(w=>w.id!==word.id);
  shuffle(others);
  const correct = primaryMeaning(word.jp);
  // ダミー候補は、正解と表記が重複しないように選ぶ
  const distractorPool = others.map(w=>primaryMeaning(w.jp)).filter(m=>m!==correct);
  const distractors = [];
  for(const m of distractorPool){
    if(distractors.length>=4) break;
    if(!distractors.includes(m)) distractors.push(m);
  }
  const choices = shuffle([correct, ...distractors]);
  return {word, choices, correctAnswer: correct, answered:false};
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}
function dueCount(){
  const now = Date.now();
  return WORDS.filter(w=>SRS[w.id].nextReview<=now).length;
}
function masteredCount(){
  return WORDS.filter(w=>SRS[w.id].stage>=MAX_STAGE).length;
}
function accuracyOverall(){
  if(LOG.length===0) return '—';
  const c = LOG.filter(l=>l.correct).length;
  return Math.round(c/LOG.length*100)+'%';
}

async function answerQuestion(choice, btn){
  if(currentQ.answered) return;
  currentQ.answered = true;
  const correct = choice===currentQ.correctAnswer;
  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled = true;
    const txt = b.querySelector('span:last-child').textContent;
    if(txt===currentQ.correctAnswer) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });

  const word = currentQ.word;
  const srs = SRS[word.id];
  const now = Date.now();
  const elapsed = srs.lastReview ? (now - srs.lastReview) : (srs.firstLearn ? now - srs.firstLearn : 0);

  // ログに記録（実際の忘却曲線データ＋回答にかかった時間）
  const responseMs = questionShownAt ? (now - questionShownAt) : null;
  LOG.push({wordId:word.id, ts:now, elapsedMs:elapsed, correct, stageBefore:srs.stage, responseMs});

  // SRS更新（エビングハウス間隔ベース）
  if(correct){
    srs.stage = Math.min(srs.stage+1, MAX_STAGE);
  }else{
    srs.stage = Math.max(0, srs.stage-2); // 不正解は大きく巻き戻す
  }
  if(!srs.firstLearn) srs.firstLearn = now;
  srs.lastReview = now;
  // 「新しく到達したステージ」に対応する間隔を使う。
  // 例: ステージ0→1（newStage=1）のときは配列の0番目（10分後）。
  // 不正解でステージが0に戻った場合も同様に0番目（10分後）が使われる。
  const intervalIdx = Math.max(0, Math.min(srs.stage-1, STAGE_INTERVALS_MS.length-1));
  srs.nextReview = now + STAGE_INTERVALS_MS[intervalIdx];

  await saveSRS(); await saveLog();

  const fb = document.getElementById('feedback');
  fb.style.color = correct ? '#3c5a48' : '#a8412b';
  const nextDays = (STAGE_INTERVALS_MS[intervalIdx]/(24*3600*1000)).toFixed(2);
  fb.innerHTML = correct
    ? `正解です。次回の復習は約 ${nextDays} 日後に設定されました。`
    : `不正解です。正解は「${currentQ.correctAnswer}」。ステージを下げ、近いうちに再度出題します。`;

  const next = document.createElement('button');
  next.className='next-btn';
  next.textContent='次の問題へ';
  next.onclick = renderQuiz;
  document.getElementById('quiz-card').appendChild(next);
}

/* ============== 忘却曲線統計 ============== */
// 経過時間バケット（実測データ集計用）
const BUCKETS = [
  {label:'〜20分', maxMs:20*60*1000},
  {label:'〜1時間', maxMs:60*60*1000},
  {label:'〜1日', maxMs:24*3600*1000},
  {label:'〜2日', maxMs:2*24*3600*1000},
  {label:'〜4日', maxMs:4*24*3600*1000},
  {label:'〜7日', maxMs:7*24*3600*1000},
  {label:'〜15日', maxMs:15*24*3600*1000},
  {label:'〜30日', maxMs:30*24*3600*1000},
  {label:'30日〜', maxMs:Infinity},
];
function computeRetentionCurve(){
  // バケットごとに、その経過時間で復習されたときの正答率を計算（lastReviewがあるもの=本当の「再生」のみ対象）
  const buckets = BUCKETS.map(()=>({total:0,correct:0}));
  LOG.forEach(l=>{
    if(l.elapsedMs===0) return; // 初回学習は忘却曲線データに含めない
    for(let i=0;i<BUCKETS.length;i++){
      if(l.elapsedMs<=BUCKETS[i].maxMs){
        buckets[i].total++;
        if(l.correct) buckets[i].correct++;
        break;
      }
    }
  });
  return buckets.map((b,i)=>({
    label:BUCKETS[i].label,
    rate: b.total>0 ? b.correct/b.total : null,
    n: b.total
  }));
}
// エビングハウスの理論曲線 R = e^(-t/S)  Sは安定性パラメータ（簡易デモ用に1.5日相当で正規化）
function theoreticalCurve(){
  const S = 1.8; // 日換算の安定度（デモ用の固定値）
  const tDaysAtBucket = [0.014,0.04,1,2,4,7,15,30,40];
  return tDaysAtBucket.map(t=>Math.exp(-t/S));
}

// ステージ（復習回数）ごとの平均回答時間・正答率を集計
// 「繰り返すほど復習が楽になっていく」(再学習コストの低下)を可視化するためのデータ
function computeStageTimings(){
  const maxStage = MAX_STAGE; // 0..MAX_STAGE
  const buckets = [];
  for(let s=0; s<=maxStage; s++) buckets.push({stage:s, total:0, correct:0, sumMs:0, nWithTime:0});
  LOG.forEach(l=>{
    const s = Math.min(l.stageBefore, maxStage);
    const b = buckets[s];
    b.total++;
    if(l.correct) b.correct++;
    if(typeof l.responseMs === 'number' && l.responseMs>=0 && l.responseMs < 5*60*1000){
      b.sumMs += l.responseMs;
      b.nWithTime++;
    }
  });
  return buckets.map(b=>({
    stage: b.stage,
    avgSec: b.nWithTime>0 ? (b.sumMs/b.nWithTime/1000) : null,
    accuracy: b.total>0 ? b.correct/b.total : null,
    n: b.total
  }));
}

function drawStageTimingChart(container, data){
  const w = Math.min(container.clientWidth||760, 760);
  const h = 260;
  const padL=48, padR=16, padT=16, padB=46;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const valid = data.filter(d=>d.avgSec!==null);
  if(valid.length===0){
    container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
      <text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="13" fill="#8a8270">まだ回答時間のデータがありません。学習を進めると表示されます。</text>
    </svg>`;
    return;
  }
  const maxSec = Math.max(...valid.map(d=>d.avgSec)) * 1.15;
  const n = data.length;
  const slot = plotW/n;
  const bw = slot*0.6;
  const yAt = sec => padT + plotH*(1-(sec/maxSec));

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">`;
  for(let gy=0; gy<=4; gy++){
    const sec = maxSec*gy/4;
    const y = yAt(sec);
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#cdbf9c" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#766f5e">${sec.toFixed(1)}秒</text>`;
  }
  data.forEach((d,i)=>{
    const cx = padL + slot*i + slot/2;
    const label = d.stage>=MAX_STAGE ? 'マスター' : 'St.'+d.stage;
    svg += `<text x="${cx}" y="${h-padB+18}" text-anchor="middle" font-size="10.5" fill="#766f5e">${label}</text>`;
    if(d.avgSec!==null){
      const y = yAt(d.avgSec);
      const barH = (padT+plotH) - y;
      svg += `<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${barH}" fill="#3c5a48" rx="2"/>`;
      svg += `<text x="${cx}" y="${y-6}" text-anchor="middle" font-size="10.5" fill="#1d2b28">${d.avgSec.toFixed(1)}s</text>`;
    }
  });
  svg += `</svg>`;
  container.innerHTML = svg;
}

      <div class="chart-wrap" id="chart-holder2"></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0;">区間別データ詳細</h3>
      <table class="wordlist">
        <thead><tr><th>経過時間</th><th>正答率（実測）</th><th>サンプル数</th></tr></thead>
        <tbody>
          ${data.map(d=>`<tr><td>${d.label}</td><td>${d.rate===null?'—':Math.round(d.rate*100)+'%'}</td><td>${d.n}</td></tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  drawChart(document.getElementById('chart-holder'), data, theory);
  drawStageTimingChart(document.getElementById('chart-holder2'), computeStageTimings());
}

function drawChart(container, data, theory){
  const w = Math.min(container.clientWidth||760, 760);
  const h = 280;
  const padL=42, padR=16, padT=16, padB=46;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  const n = data.length;
  const xAt = i => padL + (plotW*(i/(n-1)));
  const yAt = r => padT + plotH*(1-r);

  let svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">`;
  // grid + y labels
  for(let gy=0; gy<=4; gy++){
    const r = gy/4;
    const y = yAt(r);
    svg += `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#cdbf9c" stroke-width="1"/>`;
    svg += `<text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#766f5e">${Math.round(r*100)}%</text>`;
  }
  // x labels
  data.forEach((d,i)=>{
    svg += `<text x="${xAt(i)}" y="${h-padB+18}" text-anchor="middle" font-size="10.5" fill="#766f5e" transform="rotate(0)">${d.label}</text>`;
  });

  // theoretical line (dashed)
  let tpath='';
  theory.forEach((r,i)=>{
    const x=xAt(i), y=yAt(r);
    tpath += (i===0?'M':'L')+x+','+y+' ';
  });
  svg += `<path d="${tpath}" fill="none" stroke="#b5562b" stroke-width="2" stroke-dasharray="5,4"/>`;

  // actual line (solid) - skip nulls but connect available points
  const pts = data.map((d,i)=>({i,r:d.rate})).filter(p=>p.r!==null);
  if(pts.length>0){
    let apath='';
    pts.forEach((p,idx)=>{
      const x=xAt(p.i), y=yAt(p.r);
      apath += (idx===0?'M':'L')+x+','+y+' ';
    });
    svg += `<path d="${apath}" fill="none" stroke="#3c5a48" stroke-width="2.5"/>`;
    pts.forEach(p=>{
      const x=xAt(p.i), y=yAt(p.r);
      svg += `<circle cx="${x}" cy="${y}" r="4" fill="#3c5a48" stroke="#f3ede0" stroke-width="1.5"/>`;
    });
  } else {
    svg += `<text x="${w/2}" y="${h/2}" text-anchor="middle" font-size="13" fill="#8a8270">まだ復習データがありません。学習を進めると曲線が描かれます。</text>`;
  }

  svg += `</svg>`;
  container.innerHTML = svg;
}

/* ============== 起動 ============== */
(async function init(){
  views.quiz.innerHTML = `<div class="loading">読み込み中…</div>`;

  LS_AVAILABLE = checkLocalStorageAvailable();
  CURRENT_PROFILE = getActiveProfile();
  const profileLabel = document.getElementById('profile-label');
  if(profileLabel) profileLabel.textContent = 'プロファイル: ' + CURRENT_PROFILE;

  if(!LS_AVAILABLE){
    const warn = document.createElement('div');
    warn.style.cssText = 'background:#a8412b;color:#fff;padding:12px 16px;border-radius:2px;margin-bottom:16px;font-size:13.5px;';
    warn.innerHTML = `⚠ このブラウザ環境ではローカル保存（localStorage）が使用できません（file:// で開いた際にブラウザがブロックしている可能性があります）。
      このセッション中は一時的に利用できますが、ページを閉じる・再読み込みすると学習データは保存されません。
      対処法: ① Chromeなら「設定 → プライバシーとセキュリティ → サイトの設定」で、このファイルのフォルダに対する例外を確認する。
      ② または、簡易ローカルサーバー経由（例: <code>python -m http.server</code> をAAAフォルダ内で実行し、<code>http://localhost:8000/</code> からアクセス）で開くと解消することが多いです。
      ③ Firefoxではこの制限が無いことが多いので、Firefoxで開くのも有効です。`;
    document.querySelector('.wrap').insertBefore(warn, document.querySelector('header.top').nextSibling);
  }

  await loadAll();
  showTab('quiz');

  document.getElementById('export-btn').onclick = exportBackup;
  document.getElementById('import-btn').onclick = ()=>document.getElementById('import-file').click();
  document.getElementById('import-file').onchange = (e)=>{
    if(e.target.files[0]) importBackup(e.target.files[0]);
    e.target.value = '';
  };
  document.getElementById('switch-profile-btn').onclick = ()=>{
    const name = prompt(
      '切り替え先のプロファイル名を入力してください。\n'+
      '・新しい名前を入れると、完全に0からのまっさらな状態で始まります。\n'+
      '・既存の名前（例: default）を入れると、そのデータに戻れます。',
      ''
    );
    if(name===null) return; // キャンセル
    const trimmed = name.trim();
    if(trimmed===''){ alert('プロファイル名を入力してください。'); return; }
    setActiveProfile(trimmed);
    location.reload();
  };
})();
</script>
